<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagem dinâmica </h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegador</p>

    <picture>
        <source media="(max-width: 750px)" srcset="imagens/Sem título.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/MEDIA.png" type="image/png">
        <img src="imagens/GRANDE.png" alt="foto grande">
    </picture>
    <h1>Reproduzindo Áudio</h1>
    <p>Vamos aprender a reproduzir áudios em HTML5</p>
    <audio src="midia/SnapInsta.io - Nadson O Ferinha - Sete Bilhões (Clipe Oficial) (128 kbps).mp3" controls autoplay></audio>
    <audio src="midia/SnapInsta.io - Nadson O Ferinha - Sete Bilhões (Clipe Oficial) (128 kbps).mp3" controls autoplay></audio>
<audio preload="metadata" autoplay controls loop></audio>
    <source src="midia/SnapInsta.io - Nadson O Ferinha - Sete Bilhões (Clipe Oficial) (128 kbps).mp3" type="audio/mpeg">
<source src="midia/SnapInsta.io - Nadson O Ferinha - Sete Bilhões (Clipe Oficial) (128 kbps).mp3" type="audio/ogg">
<source src="midia/SnapInsta.io - Nadson O Ferinha - Sete Bilhões (Clipe Oficial) (128 kbps).mp3" type="aidop/wav">
<p>infelizmente seu navegador não consegue reproduzir o áudio. <a href="midia/SnapInsta.io - Nadson O Ferinha - Sete Bilhões (Clipe Oficial) (128 kbps).mp3">Clique aqui para baixar o arquivo MP3</a></p>
</body>
</html>
